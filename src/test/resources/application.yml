spring:
  application:
    name: everrest-funeral-arrangements
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:everresttest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: VARCHAR
      jakarta:
        persistence:
          lock:
            timeout: 8000
  thymeleaf:
    cache: true
  h2:
    console:
      enabled: false

app:
  browser:
    auto-open: false
    open-h2-console: false
  logging:
    dir: ./build/test-logs
  scheduling:
    planning-days: 21
    sunday-enabled: false
    candidate-dates: 10
