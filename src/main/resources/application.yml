server:
  port: 8080
  error:
    include-message: never
    whitelabel:
      enabled: false

spring:
  application:
    name: sports-facility-booking
  datasource:
    url: jdbc:h2:file:./data/sportsbooking;LOCK_TIMEOUT=5000
    driver-class-name: org.h2.Driver
    username: sa
    password: sportsbooking
    hikari:
      auto-commit: true
  jpa:
    open-in-view: false
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_enum_jdbc_type: VARCHAR
      jakarta:
        persistence:
          lock:
            timeout: 4000
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
        trace: false
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  messages:
    basename: messages
    encoding: UTF-8

  task:
    scheduling:
      pool:
        size: 1

app:
  browser:
    auto-open: true
    executable: firefox
  logging:
    dir: ${LOG_PATH:./logs}
  voice:
    enabled: true
    tool-webhook-secret: ${TOOL_WEBHOOK_SECRET:change-me-tool-webhook-secret}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    timezone: Europe/Warsaw
    default-duration-hours: 1
    max-slots: 5
    elevenlabs:
      api-key: ${ELEVENLABS_API_KEY:}
      agent-id: ${ELEVENLABS_AGENT_ID:}
      voice-id: ${ELEVENLABS_VOICE_ID:}
      phone-number-id: ${ELEVENLABS_PHONE_NUMBER_ID:}
    sms:
      enabled: true
      provider: log
      from: ${SMS_FROM:Courtly}
      telnyx-api-key: ${TELNYX_API_KEY:}
      telnyx-messaging-profile-id: ${TELNYX_MESSAGING_PROFILE_ID:}
      smsapi-token: ${SMSAPI_TOKEN:}
    telephony:
      provider: none
      twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
      twilio-auth-token: ${TWILIO_AUTH_TOKEN:}

logging:
  level:
    com.example.hackathoncodaro2026: INFO
    org.hibernate.SQL: debug
    org.springframework.security: info
