server:
  port: 8080
  error:
    include-message: never
    whitelabel:
      enabled: false

spring:
  application:
    name: sports-facility-booking
  datasource:
    url: jdbc:h2:file:./data/sportsbooking;LOCK_TIMEOUT=5000
    driver-class-name: org.h2.Driver
    username: sa
    password: sportsbooking
    hikari:
      auto-commit: true
  jpa:
    open-in-view: false
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_enum_jdbc_type: VARCHAR
      jakarta:
        persistence:
          lock:
            timeout: 4000
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
        trace: false
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  messages:
    basename: messages
    encoding: UTF-8

  task:
    scheduling:
      pool:
        size: 1

app:
  browser:
    auto-open: true
    executable: firefox
  logging:
    dir: ${LOG_PATH:./logs}
  voice:
    enabled: true
    tool-webhook-secret: ${TOOL_WEBHOOK_SECRET:change-me-tool-webhook-secret}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    timezone: Europe/Warsaw
    default-duration-hours: 1
    max-slots: 5
    elevenlabs:
      api-key: ${ELEVENLABS_API_KEY:}
      agent-id: ${ELEVENLABS_AGENT_ID:}
      voice-id: ${ELEVENLABS_VOICE_ID:}
      phone-number-id: ${ELEVENLABS_PHONE_NUMBER_ID:}
      webhook-secret: ${ELEVENLABS_WEBHOOK_SECRET:}
    sms:
      enabled: true
      provider: log
      from: ${TELNYX_SMS_FROM:${SMS_FROM:Courtly}}
      telnyx-api-key: ${TELNYX_API_KEY:}
      telnyx-messaging-profile-id: ${TELNYX_MESSAGING_PROFILE_ID:}
      smsapi-token: ${SMSAPI_TOKEN:}
    telephony:
      provider: ${VOICE_TELEPHONY_PROVIDER:telnyx}
      twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
      twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
      telnyx-public-key: ${TELNYX_PUBLIC_KEY:}
      telnyx-fqdn-connection-id: ${TELNYX_FQDN_CONNECTION_ID:}
      telnyx-texml-app-id: ${TELNYX_TEXML_APP_ID:}
      sip-termination-uri: ${SIP_TERMINATION_URI:sip:sip.rtc.elevenlabs.io:5060;transport=tcp}
      sip-username: ${SIP_USERNAME:}
      sip-password: ${SIP_PASSWORD:}
      sip-from-number: ${SIP_FROM_NUMBER:}

logging:
  level:
    com.example.hackathoncodaro2026: INFO
    org.hibernate.SQL: debug
    org.springframework.security: info

domain:
  brand:
    name: Courtly
    tagline: Sports Facility Booking
  llm-domain-description: sports-facility
  resource-synonyms:
    FOOTBALL:   [football, soccer]
    GYM:        [gym, workout]
    SWIMMING:   [pool, swimming, swim]

intent:
  granularity-min: 15
  buffer-min: 15
  max-suggestions: 3
  max-candidates-per-interval: 12
  shrink-duration-max-pct: 0.25
  weights:
    time-of-day: 20
    day-proximity: 15
    buffer: 15
    fragmentation: 20
    resource-load: 15
    workload: 15
  resource-attributes:
    TENNIS:      { indoor: "false", floodlit: "true",  team: "false" }
    FOOTBALL:    { indoor: "false", floodlit: "true",  team: "true"  }
    BASKETBALL:  { indoor: "true",  floodlit: "true",  team: "true"  }
    VOLLEYBALL:  { indoor: "true",  floodlit: "true",  team: "true"  }
    SWIMMING:    { indoor: "true",  floodlit: "false", team: "false" }
    GYM:         { indoor: "true",  floodlit: "false", team: "false" }
    SQUASH:      { indoor: "true",  floodlit: "false", team: "false" }
  constraints:
    - key: indoor
      kind: HARD
      relaxable: true
      label: indoor
      attribute: indoor
      equals-value: "true"
      phrases: [indoor, inside, covered, "under a roof"]
    - key: outdoor
      kind: HARD
      relaxable: true
      label: outdoor
      attribute: indoor
      equals-value: "false"
      phrases: [outdoor, outside, "open air"]
    - key: floodlit
      kind: HARD
      relaxable: true
      label: floodlit
      attribute: floodlit
      equals-value: "true"
      phrases: [floodlit, lit, "after dark", "with lights"]
    - key: team_sport
      kind: SOFT
      weight: 10
      label: team sport
      attribute: team
      equals-value: "true"
      phrases: [team, "with friends", group]
