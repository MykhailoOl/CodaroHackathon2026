server:
  port: 8080
  error:
    include-message: never
    whitelabel:
      enabled: false

spring:
  application:
    name: sports-facility-booking
  datasource:
    url: jdbc:h2:file:./data/sportsbooking;LOCK_TIMEOUT=5000
    driver-class-name: org.h2.Driver
    username: sa
    password: sportsbooking
    hikari:
      auto-commit: true
  jpa:
    open-in-view: false
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_enum_jdbc_type: VARCHAR
      jakarta:
        persistence:
          lock:
            timeout: 4000
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
        trace: false
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  messages:
    basename: messages
    encoding: UTF-8

  task:
    scheduling:
      pool:
        size: 1

app:
  browser:
    auto-open: true
    executable: firefox
  logging:
    dir: ${LOG_PATH:./logs}
  voice:
    enabled: true
    tool-webhook-secret: ${TOOL_WEBHOOK_SECRET:change-me-tool-webhook-secret}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    timezone: Europe/Warsaw
    default-duration-hours: 1
    max-slots: 5
    elevenlabs:
      api-key: ${ELEVENLABS_API_KEY:}
      agent-id: ${ELEVENLABS_AGENT_ID:}
      voice-id: ${ELEVENLABS_VOICE_ID:}
      phone-number-id: ${ELEVENLABS_PHONE_NUMBER_ID:}
      webhook-secret: ${ELEVENLABS_WEBHOOK_SECRET:}
    sms:
      enabled: true
      provider: log
      from: ${TELNYX_SMS_FROM:${SMS_FROM:Courtly}}
      telnyx-api-key: ${TELNYX_API_KEY:}
      telnyx-messaging-profile-id: ${TELNYX_MESSAGING_PROFILE_ID:}
      smsapi-token: ${SMSAPI_TOKEN:}
    telephony:
      provider: ${VOICE_TELEPHONY_PROVIDER:telnyx}
      twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
      twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
      telnyx-public-key: ${TELNYX_PUBLIC_KEY:}
      telnyx-fqdn-connection-id: ${TELNYX_FQDN_CONNECTION_ID:}
      telnyx-texml-app-id: ${TELNYX_TEXML_APP_ID:}
      sip-termination-uri: ${SIP_TERMINATION_URI:sip:sip.rtc.elevenlabs.io:5060;transport=tcp}
      sip-username: ${SIP_USERNAME:}
      sip-password: ${SIP_PASSWORD:}
      sip-from-number: ${SIP_FROM_NUMBER:}

logging:
  level:
    com.example.hackathoncodaro2026: INFO
    org.hibernate.SQL: debug
    org.springframework.security: info

domain:
  brand:
    name: EverRest
    tagline: Arrangements, within the time you have
  llm-domain-description: funeral-services
  resource-synonyms:
    CHAPEL:       [chapel, ceremony, service, funeral, mass, requiem, church]
    CREMATION:    [cremation, cremate, crematorium, cremated]
    BURIAL:       [burial, grave, plot, interment, inter, cemetery, bury]
    TRANSPORT:    [hearse, transport, cortege, cortège, transfer]
    RECEPTION:    [wake, reception, refreshments, gathering, stypa]
    VIEWING:      [viewing, repose, vigil room, chapel of rest, visitation]
    REPATRIATION: [repatriation, repatriate, abroad, overseas]

intent:
  # Signing key for the API tokens the Telegram bot and the web app hold. Leave it
  # unset and TokenService falls back to a random key generated per boot, so every
  # restart — devtools reloads included — silently invalidates every signed-in
  # session mid-conversation.
  auth:
    secret: ${INTENT_AUTH_SECRET:change-me-intent-auth-secret}
  granularity-min: 15
  buffer-min: 15
  max-suggestions: 3
  max-candidates-per-interval: 12
  shrink-duration-max-pct: 0.25
  weights:
    time-of-day: 20
    day-proximity: 15
    buffer: 15
    fragmentation: 20
    resource-load: 15
    workload: 15
  resource-attributes:
    CHAPEL:       { indoor: "true",  graveside: "false", religious: "true",  catering: "false" }
    CREMATION:    { indoor: "true",  graveside: "false", religious: "false", catering: "false" }
    BURIAL:       { indoor: "false", graveside: "true",  religious: "true",  catering: "false" }
    TRANSPORT:    { indoor: "false", graveside: "false", religious: "false", catering: "false" }
    RECEPTION:    { indoor: "true",  graveside: "false", religious: "false", catering: "true"  }
    VIEWING:      { indoor: "true",  graveside: "false", religious: "false", catering: "false" }
    REPATRIATION: { indoor: "true",  graveside: "false", religious: "false", catering: "false" }
  constraints:
    - key: indoor
      kind: HARD
      relaxable: true
      label: indoors
      attribute: indoor
      equals-value: "true"
      phrases: [indoor, indoors, inside, "under cover", "out of the rain"]
    - key: graveside
      kind: HARD
      relaxable: true
      label: graveside
      attribute: graveside
      equals-value: "true"
      phrases: [graveside, "at the grave", cemetery, plot, interment]
    - key: religious
      kind: HARD
      relaxable: true
      label: religious rite
      attribute: religious
      equals-value: "true"
      phrases: [priest, religious, church, mass, requiem, rite, blessing]
    - key: secular
      kind: HARD
      relaxable: true
      label: no religious rite
      attribute: religious
      equals-value: "false"
      phrases: [secular, humanist, "non-religious", "no religious", "no service"]
    - key: catering
      kind: SOFT
      weight: 10
      label: refreshments
      attribute: catering
      equals-value: "true"
      phrases: [refreshments, catering, food, wake, reception, stypa]

# Derived scheduling. The per-observance rules (how many days after a death each rite
# expects the service) live in RiteProperties so the feature works with no config at
# all; add a `rules:` map here only to override them. These scalars are the knobs worth
# tuning per jurisdiction.
rites:
  statutory-days: 4          # Poland: burial within 96 hours of death
  certificate-lead-days: 1   # usual wait for a death certificate after a natural death
  coroner-lead-days: 4       # wait when a coroner or prosecutor must release the body
  hold-decision-hour: 21     # evening cut-off for the family to confirm a held slot
