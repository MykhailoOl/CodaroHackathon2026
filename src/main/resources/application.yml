server:
  port: 8080
  error:
    include-message: never
    whitelabel:
      enabled: false

spring:
  application:
    name: everrest-funeral-arrangements
  datasource:
    url: jdbc:h2:file:./data/everrest;LOCK_TIMEOUT=5000
    driver-class-name: org.h2.Driver
    username: sa
    password: everrest
    hikari:
      auto-commit: true
  jpa:
    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_enum_jdbc_type: VARCHAR
      jakarta:
        persistence:
          lock:
            timeout: 4000
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
        trace: false
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  messages:
    basename: messages
    encoding: UTF-8
  task:
    scheduling:
      pool:
        size: 1

app:
  browser:
    auto-open: true
    open-h2-console: true
    executable: firefox
  logging:
    dir: ${LOG_PATH:./logs}
  scheduling:
    planning-days: 21
    sunday-enabled: false
    candidate-dates: 10
  voice:
    enabled: true
    tool-webhook-secret: ${TOOL_WEBHOOK_SECRET:change-me-tool-webhook-secret}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    timezone: Europe/Warsaw
    max-slots: 1
    elevenlabs:
      api-key: ${ELEVENLABS_API_KEY:}
      agent-id: ${ELEVENLABS_AGENT_ID:}
      voice-id: ${ELEVENLABS_VOICE_ID:}
      phone-number-id: ${ELEVENLABS_PHONE_NUMBER_ID:}
      webhook-secret: ${ELEVENLABS_WEBHOOK_SECRET:}
    sms:
      enabled: true
      provider: log
      from: ${TELNYX_SMS_FROM:${SMS_FROM:EverRest}}
      telnyx-api-key: ${TELNYX_API_KEY:}
      telnyx-messaging-profile-id: ${TELNYX_MESSAGING_PROFILE_ID:}
      smsapi-token: ${SMSAPI_TOKEN:}
    telephony:
      provider: ${VOICE_TELEPHONY_PROVIDER:telnyx}
      twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
      twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
      telnyx-public-key: ${TELNYX_PUBLIC_KEY:}
      telnyx-fqdn-connection-id: ${TELNYX_FQDN_CONNECTION_ID:}
      telnyx-texml-app-id: ${TELNYX_TEXML_APP_ID:}
      sip-termination-uri: ${SIP_TERMINATION_URI:sip:sip.rtc.elevenlabs.io:5060;transport=tcp}
      sip-username: ${SIP_USERNAME:}
      sip-password: ${SIP_PASSWORD:}
      sip-from-number: ${SIP_FROM_NUMBER:}

logging:
  level:
    com.example.hackathoncodaro2026: INFO
    org.hibernate.SQL: info
    org.springframework.security: info
