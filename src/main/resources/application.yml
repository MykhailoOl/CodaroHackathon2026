server:
  port: 8080
  error:
    include-message: never
    whitelabel:
      enabled: false

spring:
  application:
    name: everrest-funeral-arrangements
  datasource:
    url: jdbc:h2:file:./data/everrest;LOCK_TIMEOUT=5000
    driver-class-name: org.h2.Driver
    username: sa
    password: everrest
    hikari:
      auto-commit: true
  jpa:
    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_enum_jdbc_type: VARCHAR
      jakarta:
        persistence:
          lock:
            timeout: 4000
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
        trace: false
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  messages:
    basename: messages
    encoding: UTF-8
  task:
    scheduling:
      pool:
        size: 1

app:
  browser:
    auto-open: true
    open-h2-console: true
    executable: firefox
  logging:
    dir: ${LOG_PATH:./logs}
  scheduling:
    planning-days: 21
    sunday-enabled: false
    candidate-dates: 10

logging:
  level:
    com.example.hackathoncodaro2026: INFO
    org.hibernate.SQL: info
    org.springframework.security: info
