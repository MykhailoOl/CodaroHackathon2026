# Warsaw funeral-home and cemetery network. Read at startup by SeedDataLoader, only
# when the DB is empty.
#
# The cemeteries are the real Warsaw ones at their real addresses, because which ground
# a family can be buried in is not interchangeable: the Jewish cemetery on Okopowa, the
# Orthodox cemetery on Wolska and the Tatar cemetery on Tatarska serve exactly the rites
# whose burial deadlines RiteProperties encodes. The funeral houses, and every phone
# number on this page, are invented.
#
# `capacity` is concurrent occupancy, not attendance: a chapel holds one ceremony at a
# time whatever its size, while a transport depot can dispatch several hearses at once.
# Attendance is the party size, bounded per service by ResourceType.

facilities:
  - name: "Dom Pogrzebowy Powązki"
    description: "The main house, beside the old Powązki cemetery in Wola. Two chapels, a room of repose, and the cortège depot."
    phone: "+48 22 100 20 01"
    coverType: CHAPEL
    address: { street: "ul. Powązkowska", buildingNumber: "14", postalCode: "01-797", district: "Wola" }
    resources:
      - { name: "St. Barbara Chapel", type: CHAPEL, capacity: 1 }
      - { name: "Small Chapel", type: CHAPEL, capacity: 1, address: { street: "ul. Powązkowska", buildingNumber: "14A", postalCode: "01-797", district: "Wola" } }
      - { name: "Room of Repose", type: VIEWING, capacity: 4 }
