<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head(${facility.name})}"></head>
<body class="app-body">
<div class="court-grid" aria-hidden="true"></div>
<header th:replace="~{fragments/nav :: header}"></header>
<main class="dashboard">
    <p class="crumb"><a th:href="@{/facilities}">Facilities</a> / <span th:text="${facility.name}">Venue</span></p>
    <section class="sport-banner">
        <img th:src="@{${facility.imagePath != null ? facility.imagePath : '/images/services/chapel.svg'}}"
             th:alt="${facility.name}">
        <div class="sport-banner-copy">
            <p class="eyebrow" th:text="${facility.address.district}">District</p>
            <h1 th:text="${facility.name}">Facility</h1>
            <p class="lede" th:text="${facility.description}">Description</p>
            <p class="address-line" th:text="${facility.address.toDisplayString()}">Address</p>
            <p class="meta-label" th:if="${facility.phone != null}" th:text="${facility.phone}">Phone</p>
        </div>
    </section>
    <div class="section-head">
        <h2>Bookable instances</h2>
        <p>Each service, hall, and gym keeps its own Warsaw address.</p>
    </div>
    <div class="venue-grid">
        <a class="venue-card" th:each="item : ${resources}" th:href="@{/resources/{id}(id=${item.id})}">
            <img class="venue-thumb"
                 th:src="@{${item.imagePath != null ? item.imagePath : item.type.imagePath}}"
                 th:alt="${item.type.displayName}">
            <div class="venue-card-body">
                <span class="chip" th:text="${item.type.displayName}">Chapel ceremony</span>
                <h3 th:text="${item.name}">Chapel 1</h3>
                <p class="address-line" th:text="${item.address.toDisplayString()}">Address</p>
                <p class="meta-label">
                    Capacity <span th:text="${item.capacity}">1</span>
                    · <span th:text="${item.slotDurationMinutes}">60</span> min
                    · <span th:text="${item.openingTime}">07:00</span>–<span th:text="${item.closingTime}">22:00</span>
                </p>
            </div>
        </a>
    </div>
</main>
<footer th:replace="~{fragments/nav :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
