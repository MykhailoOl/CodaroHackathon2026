<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Create staff')}"></head>
<body class="app-body">
<div class="court-grid" aria-hidden="true"></div>
<header th:replace="~{fragments/nav :: header}"></header>
<main class="dashboard">
    <section class="auth-panel profile-panel">
        <p class="eyebrow">Admin</p>
        <h1>Create a staff account</h1>
        <p class="lede">Add a manager, family member, or celebrant. Role cannot be changed later from this form.</p>
        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <form id="register-form" class="auth-form" th:action="@{/admin/users}" th:object="${adminUserCreateRequest}" method="post" novalidate>
            <div class="field-grid">
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" th:field="*{username}" type="text" autocomplete="username" required minlength="3" maxlength="32">
                    <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                    <p class="field-error" data-error-for="username" hidden></p>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" th:field="*{email}" type="email" autocomplete="email" required maxlength="254">
                    <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    <p class="field-error" data-error-for="email" hidden></p>
                </div>
            </div>
            <div class="field">
                <label for="fullName">Full name</label>
                <input id="fullName" th:field="*{fullName}" type="text" autocomplete="name" required minlength="2" maxlength="100">
                <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
                <p class="field-error" data-error-for="fullName" hidden></p>
            </div>
            <div class="field">
                <label for="phone">Phone <span class="optional">(optional)</span></label>
                <input id="phone" th:field="*{phone}" type="tel" autocomplete="tel" maxlength="20">
                <p class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                <p class="field-error" data-error-for="phone" hidden></p>
            </div>
            <div class="field">
                <label for="role">Role</label>
                <select id="role" th:field="*{role}">
                    <option th:each="item : ${roles}" th:value="${item}" th:text="${item.label}">Manager</option>
                </select>
                <p class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></p>
            </div>
            <div class="field-grid">
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" th:field="*{password}" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
                    <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    <p class="field-error" data-error-for="password" hidden></p>
                </div>
                <div class="field">
                    <label for="confirmPassword">Confirm password</label>
                    <input id="confirmPassword" th:field="*{confirmPassword}" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
                    <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                    <p class="field-error" data-error-for="confirmPassword" hidden></p>
                </div>
            </div>
            <button class="btn btn-accent btn-block" type="submit">Create account</button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/nav :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/register.js}"></script>
</body>
</html>
