<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Something went wrong')}"></head>
<body class="auth-body">
<div class="court-grid" aria-hidden="true"></div>
<header th:replace="~{fragments/nav :: header}"></header>
<main class="auth-main">
    <section class="auth-panel">
        <p class="eyebrow">Unavailable</p>
        <h1>This page could not be opened</h1>
        <p class="lede" th:text="${errorMessage != null ? errorMessage : 'The page you wanted is not available.'}">The page you wanted is not available.</p>
        <a class="btn btn-accent" th:href="@{/}">Return home</a>
    </section>
</main>
<footer th:replace="~{fragments/nav :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
