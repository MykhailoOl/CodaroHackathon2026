<head xmlns:th="http://www.thymeleaf.org" th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1A1A1D">
    <meta name="everrest-user-id" th:content="${currentUser != null ? currentUser.id : 'anon'}">
    <meta name="everrest-username" th:content="${currentUser != null ? currentUser.username : ''}">
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' · EverRest'">EverRest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css(v=5)}">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/brand/mark.svg}">
</head>
