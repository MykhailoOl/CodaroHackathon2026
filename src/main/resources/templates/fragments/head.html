<head xmlns:th="http://www.thymeleaf.org" th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2E8B57">
    <title th:text="${title} + ' · ' + ${brand.name}">Courtly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/brand/mark.svg}">
    <link rel="icon" type="image/png" sizes="64x64" th:href="@{/images/brand/favicon.png}">
    <link rel="apple-touch-icon" th:href="@{/images/brand/logo.png}">
</head>
