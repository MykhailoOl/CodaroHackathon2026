<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<body>
<header class="site-header" th:fragment="header">
    <div class="header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark" aria-hidden="true">
                <img th:src="@{/images/brand/mark.svg}" alt="" width="40" height="40">
            </span>
            <span class="brand-copy">
                <span class="brand-name">EverRest</span>
                <span class="brand-tag">Funeral arrangements</span>
            </span>
        </a>
        <nav class="main-nav" aria-label="Primary">
            <th:block sec:authorize="isAuthenticated()">
                <a class="nav-link" th:href="@{/homes}">Homes</a>
                <a class="nav-link" th:href="@{/reservations}">History</a>
                <a class="nav-link nav-notify" th:href="@{/notifications}">
                    Notices
                    <span class="nav-badge"
                          th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}"
                          th:text="${unreadNotificationCount}">1</span>
                </a>
                <a class="nav-link" th:href="@{/availability}">Availability</a>
                <a class="nav-link" sec:authorize="hasAnyRole('ADMIN','MANAGER')" th:href="@{/manager/reservations}">Queue</a>
                <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Staff</a>
                <span class="nav-user" th:if="${currentUser != null}">
                    <a class="nav-user-name"
                       th:href="@{/profile}"
                       th:text="${currentUser.fullName != null and !#strings.isEmpty(currentUser.fullName) ? currentUser.fullName : currentUser.username}">Family</a>
                </span>
                <form class="logout-form" th:action="@{/logout}" method="post">
                    <button class="btn btn-ghost" type="submit">Log out</button>
                </form>
            </th:block>
            <th:block sec:authorize="isAnonymous()">
                <a class="nav-link" th:href="@{/login}">Sign in</a>
                <a class="btn btn-accent" th:href="@{/register}">Create account</a>
            </th:block>
        </nav>
    </div>
</header>
<th:block th:fragment="footer">
    <div class="ink-veil" aria-hidden="true">
        <svg class="ink-shapes" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" focusable="false">

            </g>
            <g class="ink-floater ink-floater-c">
                <path class="ink-blot ink-blot-c" d="M210 720c-70 48-46 148 42 168 78 18 156-42 176-118 18-70-48-112-118-98-52 10-62 64-18 78 32 10 58-28 28-46-24-14-58 8-36 36"/>
            </g>

            </g>

            </g>

            </g>
            <g class="ink-floater ink-floater-g">
                <circle class="ink-blot ink-blot-g" cx="430" cy="160" r="18"/>
            </g>
            <g class="ink-floater ink-floater-h">
                <circle class="ink-blot ink-blot-h" cx="1088" cy="300" r="11"/>

                <circle class="ink-blot ink-blot-i" cx="340" cy="540" r="14"/>

                <circle class="ink-blot ink-blot-j" cx="1240" cy="520" r="9"/>
            </g>
        </svg>
    </div>
    <footer class="site-footer">
        <p>EverRest · Track B resource reservation and scheduling · Warsaw demo</p>
    </footer>
    <script th:src="@{/js/calendar.js(v=2)}"></script>
    <th:block sec:authorize="isAuthenticated()">
        <th:block th:replace="~{fragments/assistant :: widget}"></th:block>
    </th:block>
</th:block>
</body>
</html>
