<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Edit arrangement')}"></head>
<body class="app-body">
<div class="court-grid" aria-hidden="true"></div>
<header th:replace="~{fragments/nav :: header}"></header>
<main class="dashboard">
    <div class="section-head">
        <p class="eyebrow">Pending only</p>
        <h1>Update arrangement</h1>
        <p>The venue, package, and assigned date stay the same. You may update ceremony details, guests, extras, payment, and the private note.</p>
        <p class="meta-label">
            Assigned
            <span th:text="${#temporals.format(reservation.startAt, 'yyyy-MM-dd HH:mm')}">2026-08-20 10:00</span>
            at
            <span th:text="${venue.name}">Venue</span>
        </p>
    </div>
    <form class="auth-form" th:action="@{/reservations/{id}/edit(id=${reservation.id})}" th:object="${arrangementRequest}" method="post" novalidate>
        <input type="hidden" th:field="*{venueId}">
        <input type="hidden" th:field="*{funeralPackage}">
        <div class="field">
            <label for="serviceType">Ceremony type</label>
            <select id="serviceType" th:field="*{serviceType}" required>
                <option th:each="type : ${serviceTypes}" th:value="${type}" th:text="${type.label}">Memorial</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('serviceType')}" th:errors="*{serviceType}"></p>
        </div>
        <div class="field">
            <label for="deceasedFullName">Full name</label>
            <input id="deceasedFullName" th:field="*{deceasedFullName}" type="text" required maxlength="120" autocomplete="off">
            <p class="field-error" th:if="${#fields.hasErrors('deceasedFullName')}" th:errors="*{deceasedFullName}"></p>
        </div>
        <div class="field-grid">
            <div class="field">
                <label for="dateOfBirth">Date of birth <span class="optional">(optional)</span></label>
                <input id="dateOfBirth" th:field="*{dateOfBirth}" type="date">
            </div>
            <div class="field">
                <label for="dateOfDeath">Date of death</label>
                <input id="dateOfDeath" th:field="*{dateOfDeath}" type="date" required>
                <p class="field-error" th:if="${#fields.hasErrors('dateOfDeath')}" th:errors="*{dateOfDeath}"></p>
            </div>
        </div>
        <div class="field">
            <label for="attendees">Guests</label>
            <input id="attendees" th:field="*{attendees}" type="number" min="1" th:max="${venue.maxAttendees}" required>
            <p class="field-error" th:if="${#fields.hasErrors('attendees')}" th:errors="*{attendees}"></p>
        </div>
        <div class="field" th:if="${phoneRequired}">
            <label for="phone">Contact phone</label>
            <input id="phone" th:field="*{phone}" type="tel" maxlength="20">
            <p class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
        </div>
        <fieldset>
            <legend>Extras</legend>
            <label class="extra-option" th:each="extra : ${extras}"
                   th:if="${extra.requiredServiceType == null or extra.requiredServiceType == arrangementRequest.serviceType}">
                <input type="checkbox" th:field="*{extraIds}" th:value="${extra.id}">
                <span th:text="${extra.name + ' · ' + extra.amount + ' PLN'}">Flowers</span>
            </label>
        </fieldset>
        <div class="field">
            <label for="paymentMethod">Payment</label>
            <select id="paymentMethod" th:field="*{paymentMethod}">
                <option th:each="method : ${paymentMethods}" th:value="${method}" th:text="${method.label}">Cash</option>
            </select>
        </div>
        <div class="field">
            <label for="note">Private family note</label>
            <textarea id="note" th:field="*{note}" maxlength="1000" rows="3"></textarea>
        </div>
        <p class="field-error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>
        <button class="btn btn-accent" type="submit">Save changes</button>
        <a class="btn btn-ghost" th:href="@{/reservations}">Back</a>
    </form>
</main>
<footer th:replace="~{fragments/nav :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
