<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Calendar invite')}"></head>
<body class="auth-body">
<div class="court-grid" aria-hidden="true"></div>
<header th:replace="~{fragments/nav :: header}"></header>
<main class="auth-main">
    <section class="auth-panel">
        <p class="eyebrow">Phone booking</p>
        <h1>Add this booking to your calendar</h1>
        <p class="lede" th:if="${reservation != null}">
            <span th:text="${reservation.resource.name}">Court</span>
            on
            <span th:text="${#temporals.format(reservation.startAt, 'EEE d MMM HH:mm')}">time</span>.
        </p>
        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <form class="auth-form" th:action="@{/voice/invite/{token}(token=${token})}" method="post">
            <div class="field">
                <label for="email">Email for the invitation</label>
                <input id="email" name="email" type="email" required maxlength="254"
                       th:value="${reservation.inviteEmail}"
                       autocomplete="email" placeholder="you@example.com">
            </div>
            <button class="btn btn-accent btn-block" type="submit">Send invitation</button>
        </form>
        <p class="auth-switch">
            <a th:href="@{/voice/invite/{token}/calendar.ics(token=${token})}">Download calendar file (.ics)</a>
        </p>
    </section>
</main>
<footer th:replace="~{fragments/nav :: footer}"></footer>
</body>
</html>
